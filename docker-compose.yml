services:
  postgres:
    image: postgres:16-alpine
    container_name: technobaazar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: technobaazar
      POSTGRES_USER: technobaazar
      POSTGRES_PASSWORD: technobaazar
    ports:
      - "5432:5432"
    volumes:
      - technobaazar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technobaazar -d technobaazar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  technobaazar_postgres:
